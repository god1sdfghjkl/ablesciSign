name: Keepalive

on:
  schedule:
    - cron: "0 0 1,20 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keepalive:
    name: 保持仓库活跃
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v5
      - name: 更新保活文件
        run: |
          echo "Last keepalive: $(date -u '+%Y-%m-%d %H:%M:%S UTC')" > .github/.keepalive
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/.keepalive
          git diff --staged --quiet || git commit -m "chore: keepalive $(date -u '+%Y-%m-%d')"
          git push
